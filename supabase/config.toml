# Codestep: project auth settings. Review and apply with:   supabase config push
# (it prints a diff of what will change on the linked project and asks you to confirm).
# Contains no secrets. Google sign-in credentials are referenced from environment variables.
project_id = "codestep"

[auth]
enabled = true
site_url = "https://simonhyross.github.io/codestep/"
# Only these URLs may receive sign-in / confirmation / reset redirects (blocks open-redirect abuse).
additional_redirect_urls = ["https://simonhyross.github.io/codestep/", "http://localhost:5180/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true          # people must confirm their address before signing in
double_confirm_changes = true
secure_password_change = true        # changing a password needs a recent sign-in
max_frequency = "60s"                # at most one auth email per address per minute

# Two-step verification is not offered by the app.
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# Google sign-in: create an OAuth client first (see SETUP.md), export the two variables, set enabled = true, push again.
#   export GOOGLE_CLIENT_ID=...   export GOOGLE_CLIENT_SECRET=...
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
